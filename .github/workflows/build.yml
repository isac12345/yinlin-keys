name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cek kunci rilis ada (hanya tag v)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secret kunci rilis kosong pada run tag; batalkan, jangan rilis APK debug-signed"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Siapkan kunci rilis dari brankas
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
      - run: gradle testDebugUnitTest --no-daemon
      - name: Build release APK (tanda tangan kunci sendiri)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Rilis otomatis (hanya tag v)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/YinlinKeys-${GITHUB_REF_NAME#v}.apk"
          ( cd dist && sha256sum YinlinKeys-*.apk > SHA256SUMS.txt )
          gh release create "$GITHUB_REF_NAME" \
            "dist/YinlinKeys-${GITHUB_REF_NAME#v}.apk" dist/SHA256SUMS.txt \
            --notes-file RELEASE_NOTES.md --draft
      - uses: actions/upload-artifact@v4
        with:
          name: YinlinKeys-apk
          path: app/build/outputs/apk/release/*.apk
