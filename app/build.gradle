plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yinlin.keys'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yinlin.keys'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI: kunci rilis dari brankas; lokal: debug key
            signingConfig System.getenv("KEYSTORE_PASSWORD") != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Hanya untuk ujian (tidak masuk APK): JUnit4
    testImplementation 'junit:junit:4.13.2'
}
